# Expected GitHub settings for milestone 1, checked by `python -m rp.ops.verify_settings`.
# Field names follow the GitHub REST API (version 2022-11-28). Repository names may use
# {org}, so the same file checks the staging and production organisations.
# Apps, rulesets, environments and secrets are added in milestone 4.
schema_version: 1
organisation: we-solve-staging
org:
  two_factor_requirement_enabled: true
  default_repository_permission: read
  members_can_create_repositories: false
actions:
  enabled_repositories: all
  allowed_actions: selected
  sha_pinning_required: true
selected_actions:
  github_owned_allowed: false
  verified_allowed: false
  patterns_allowed:
    - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
workflow:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false
fork_pr_approval:
  approval_policy: first_time_contributors_new_to_github
repositories:
  "{org}.github.io":
    visibility: public
    default_branch: main
    secret_scanning: enabled
    secret_scanning_push_protection: enabled
    branches: [main]
  research:
    visibility: public
    default_branch: main
    secret_scanning: enabled
    secret_scanning_push_protection: enabled
    branches: [main, automation-ledger]
