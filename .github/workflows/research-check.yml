name: research-check

# Reusable format check for pull requests to the research repository. The research
# repository calls it at a pinned commit. Contributor files are read as data only:
# no contributor code, dependency, script or workflow runs here.
on:
  workflow_call:
    inputs:
      platform_repo:
        description: OWNER/NAME of the platform repository
        required: true
        type: string
      platform_ref:
        description: Full platform commit SHA to run the checks from
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate the platform pin
        env:
          PLATFORM_REPO: ${{ inputs.platform_repo }}
          PLATFORM_REF: ${{ inputs.platform_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM_REPO" in
            we-solve-staging/we-solve-staging.github.io|we-solve/we-solve.github.io) ;;
            *) echo "unknown platform repository" >&2; exit 1 ;;
          esac
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "platform_ref must be a full commit SHA" >&2; exit 1; }

      - name: Check out the platform at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: _platform
          persist-credentials: false

      - name: Check out the pull request merged onto its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _research
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked platform dependencies
        run: python -m pip install --require-hashes --no-deps -r _platform/requirements/dev.txt

      - name: Check the new folders
        env:
          PYTHONPATH: ${{ github.workspace }}/_platform
          PYTHONDONTWRITEBYTECODE: '1'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -P -m rp check --dir "$GITHUB_WORKSPACE/_research" --base HEAD^1 --head HEAD

  links:
    # Pin verification through the GitHub and Hugging Face APIs only, with no credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate the platform pin
        env:
          PLATFORM_REPO: ${{ inputs.platform_repo }}
          PLATFORM_REF: ${{ inputs.platform_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM_REPO" in
            we-solve-staging/we-solve-staging.github.io|we-solve/we-solve.github.io) ;;
            *) echo "unknown platform repository" >&2; exit 1 ;;
          esac
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "platform_ref must be a full commit SHA" >&2; exit 1; }

      - name: Check out the platform at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: _platform
          persist-credentials: false

      - name: Check out the pull request merged onto its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _research
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked platform dependencies
        run: python -m pip install --require-hashes --no-deps -r _platform/requirements/dev.txt

      - name: Verify pinned artifact links
        env:
          PYTHONPATH: ${{ github.workspace }}/_platform
          PYTHONDONTWRITEBYTECODE: '1'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -P -m rp links verify --dir "$GITHUB_WORKSPACE/_research" --base HEAD^1 --head HEAD
