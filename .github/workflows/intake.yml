name: intake

# Reusable intake bot for the research repository (spec §6, §16). The research
# repository calls it at a pinned commit. It never checks out or runs pull-request
# code: changed files are read through the API as data, and only platform code runs.
# Not deployed until the owner approves the intake GitHub App (operations/intake-app.md).
on:
  workflow_call:
    inputs:
      platform_repo:
        required: true
        type: string
      platform_ref:
        required: true
        type: string
      app_id:
        required: true
        type: string
      all_open:
        description: Reconcile every open intake item (scheduled run)
        required: false
        type: boolean
        default: false
    secrets:
      intake_app_private_key:
        required: true

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: intake
    steps:
      - name: Validate the platform pin
        env:
          PLATFORM_REPO: ${{ inputs.platform_repo }}
          PLATFORM_REF: ${{ inputs.platform_ref }}
          APP_ID: ${{ inputs.app_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM_REPO" in
            we-solve-staging/we-solve-staging.github.io|we-solve/we-solve.github.io) ;;
            *) echo "unknown platform repository" >&2; exit 1 ;;
          esac
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "platform_ref must be a full commit SHA" >&2; exit 1; }
          [[ "$APP_ID" =~ ^[0-9]+$ ]] || { echo "app_id must be numeric" >&2; exit 1; }

      - name: Check out the platform at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: _platform
          persist-credentials: false

      - name: Check out accepted research (the default branch, never the pull request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _research
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked platform dependencies
        run: python -m pip install --require-hashes --no-deps -r _platform/requirements/dev.txt

      - name: Mint a short-lived intake App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.intake_app_private_key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Process the event
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PYTHONPATH: ${{ github.workspace }}/_platform
          PYTHONDONTWRITEBYTECODE: '1'
          REPO: ${{ github.repository }}
          APP_ID: ${{ inputs.app_id }}
          ALL_OPEN: ${{ inputs.all_open }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ALL_OPEN" = "true" ]; then
            python -P -m rp intake run --repo "$REPO" --app-id "$APP_ID" --all-open --dir "$GITHUB_WORKSPACE/_research"
          else
            python -P -m rp intake run --repo "$REPO" --app-id "$APP_ID" --event "$GITHUB_EVENT_PATH" --dir "$GITHUB_WORKSPACE/_research"
          fi
