name: intake

# Thin caller: the intake bot lives in the platform repository at a pinned commit.
# pull_request_target runs this trusted file from the default branch; the bot reads
# pull-request files through the API as data and never checks out or runs them.
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: intake-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  intake:
    uses: {{PLATFORM_REPO}}/.github/workflows/intake.yml@{{PLATFORM_REF}}
    with:
      platform_repo: {{PLATFORM_REPO}}
      platform_ref: {{PLATFORM_REF}}
      app_id: '{{INTAKE_APP_ID}}'
      all_open: ${{ github.event_name == 'schedule' }}
    secrets:
      intake_app_private_key: ${{ secrets.INTAKE_APP_PRIVATE_KEY }}
